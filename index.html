<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emoji Status</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .background-character {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-25%, -50%);
            width: 1050px;
            height: auto;
            z-index: 0;
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            z-index: 1;
            position: relative;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #b0b0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .statuses-container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 1;
            position: relative;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 20px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.15) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .status-card:hover::before {
            opacity: 1;
        }

        .status-card:active {
            transform: scale(0.96);
        }

        .status-card.selected {
            background: rgba(147, 51, 234, 0.2);
            border-color: rgba(147, 51, 234, 0.5);
            box-shadow: 0 8px 32px rgba(147, 51, 234, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .status-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background: rgba(147, 51, 234, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(147, 51, 234, 0.2);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .status-card.selected .status-icon {
            background: rgba(147, 51, 234, 0.25);
            border-color: rgba(147, 51, 234, 0.5);
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(147, 51, 234, 0.3);
        }

        .status-info {
            flex: 1;
        }

        .status-name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .status-description {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1.4;
            font-weight: 400;
        }

        .status-indicator {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(147, 51, 234, 0.15);
            border: 2px solid rgba(147, 51, 234, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .status-card.selected .status-indicator {
            background: #9333EA;
            border-color: #9333EA;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.5);
        }

        .status-indicator svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        .status-card.selected .status-indicator svg {
            stroke: #ffffff;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 16px;
            }

            .header h1 {
                font-size: 26px;
            }

            .header p {
                font-size: 14px;
            }

            .background-character {
                width: 500px;
            }

            .status-icon {
                width: 52px;
                height: 52px;
                font-size: 28px;
            }

            .status-name {
                font-size: 16px;
            }

            .status-description {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <img src="chr.png" alt="" class="background-character">

    <div class="header">
        <h1>Выберите статус</h1>
        <p>Нажмите для мгновенной установки</p>
    </div>

    <div class="statuses-container">
        <div class="status-card" data-status="fire" data-emoji="🔥">
            <div class="status-content">
                <div class="status-icon">🔥</div>
                <div class="status-info">
                    <div class="status-name">Огонь</div>
                    <div class="status-description">Энергия, страсть и уверенность</div>
                </div>
                <div class="status-indicator">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
            </div>
        </div>

        <div class="status-card" data-status="crystal" data-emoji="💎">
            <div class="status-content">
                <div class="status-icon">💎</div>
                <div class="status-info">
                    <div class="status-name">Кристалл</div>
                    <div class="status-description">Ценность, уникальность и стиль</div>
                </div>
                <div class="status-indicator">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
            </div>
        </div>

        <div class="status-card" data-status="moon" data-emoji="🌙">
            <div class="status-content">
                <div class="status-icon">🌙</div>
                <div class="status-info">
                    <div class="status-name">Луна</div>
                    <div class="status-description">Спокойствие, тайна и гармония</div>
                </div>
                <div class="status-indicator">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
            </div>
        </div>
    </div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const STATUS_IDS = {
    fire: "5287670934029761167",
    crystal: "5303406233913420508",
    moon: "5287547947641241756"
};

const cards = document.querySelectorAll(".status-card");

cards.forEach(card => {
    card.addEventListener("click", () => {
        const statusId = STATUS_IDS[card.dataset.status];

        if (!statusId || !tg.isVersionAtLeast("8.0")) {
            tg.showAlert("Эта функция недоступна. Обновите Telegram.");
            return;
        }

        cards.forEach(item => item.classList.remove("selected"));
        card.classList.add("selected");

        tg.requestEmojiStatusAccess(granted => {
            if (!granted) {
                tg.showAlert("Доступ не предоставлен.");
                return;
            }

            tg.setEmojiStatus(statusId, { duration: 86400 }, success => {
                tg.showAlert(
                    success
                        ? "Статус успешно установлен!"
                        : "Не удалось установить статус."
                );
            });
        });
    });
});
</script>
</body>
</html>
