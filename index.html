<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Туберкулёз - Выбор стиля</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Убран блок .background-character */

        .header {
            text-align: center;
            margin-bottom: 30px;
            z-index: 1;
            position: relative;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #b0b0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .statuses-container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1;
            position: relative;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border-radius: 18px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .status-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .status-card:active {
            transform: scale(0.98);
        }

        .status-card.selected {
            background: rgba(147, 51, 234, 0.15);
            border-color: rgba(147, 51, 234, 0.4);
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.2);
        }

        /* Стилизация иконок-картинок */
        .status-icon-wrapper {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-icon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .status-info {
            flex: 1;
            min-width: 0; /* Для корректного обрезания текста */
        }

        .status-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-description {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-indicator {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .status-card.selected .status-indicator {
            background: #9333EA;
            border-color: #9333EA;
            box-shadow: 0 0 10px rgba(147, 51, 234, 0.5);
        }

        .status-indicator svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        .status-card.selected .status-indicator svg {
            stroke: #ffffff;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 16px;
            }
            
            .status-icon-wrapper {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>

    <!-- Фоновая картинка удалена -->

    <div class="header">
        <h1>Выберите статус</h1>
        <p>Нажмите для мгновенной установки</p>
    </div>

    <div class="statuses-container">
        
        <!-- Статус 1: Огонь (заменим на ваш первый GIF или оставим старый? 
             Вы просили заменить огонь/кристалл/луна на гиф/фото из списка. 
             Ниже приведены ваши новые варианты. Если нужно оставить старые - добавьте их обратно) -->
        
        <div class="status-card" data-status="charm" data-id="YOUR_ID_HERE_1">
            <div class="status-icon-wrapper">
                <img src="https://i.gifer.com/embedded/download/PsE.gif" alt="Charm" class="status-icon-img">
            </div>
            <div class="status-info">
                <div class="status-name">Очарование</div>
                <div class="status-description">Стань неотразимой</div>
            </div>
            <div class="status-indicator">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
        </div>

        <div class="status-card" data-status="strategy" data-id="YOUR_ID_HERE_2">
            <div class="status-icon-wrapper">
                <img src="https://media1.tenor.com/m/osKwWYJZjk8AAAAd/lelouch.gif" alt="Strategy" class="status-icon-img">
            </div>
            <div class="status-info">
                <div class="status-name">Стратегия</div>
                <div class="status-description">Будь умнее всех</div>
            </div>
            <div class="status-indicator">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
        </div>

        <div class="status-card" data-status="charisma" data-id="YOUR_ID_HERE_3">
            <div class="status-icon-wrapper">
                <img src="https://avatars.akamai.steamstatic.com/2ac4b72587acde2e444f8ad9a89622db13000956_full.jpg" alt="Charisma" class="status-icon-img">
            </div>
            <div class="status-info">
                <div class="status-name">Харизма</div>
                <div class="status-description">Максимальная уверенность</div>
            </div>
            <div class="status-indicator">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
        </div>

        <!-- Пример того, как вернуть старые статусы, если они тоже нужны -->
        <!--
        <div class="status-card" data-status="fire" data-id="5287670934029761167">
            ... старая структура ...
        </div>
        -->

    </div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ВАЖНО: Замените значения в объекте STATUS_MAP на реальные ID эмодзи-статусов из вашего бота/Telegram.
// Поскольку у вас были ссылки на внешние картинки, а не встроенные эмодзи Telegram, 
// вам нужно либо создать свои кастомные эмодзи в TG Premium, либо использовать существующие ID.
// Сейчас здесь заглушки. Вам нужно подставить правильные ID от Telegram Bot API.
const STATUS_MAP = {
    charm: "REPLACE_WITH_REAL_EMOJI_STATUS_ID_1", 
    strategy: "REPLACE_WITH_REAL_EMOJI_STATUS_ID_2",
    charisma: "REPLACE_WITH_REAL_EMOJI_STATUS_ID_3"
};

const cards = document.querySelectorAll(".status-card");

cards.forEach(card => {
    card.addEventListener("click", () => {
        const statusKey = card.dataset.status;
        // Берем ID напрямую из data-атрибута, чтобы можно было менять его без JS
        let statusId = card.dataset.id; 
        
        // Логика проверки версии и доступа
        if (!tg.isVersionAtLeast("8.0")) {
            tg.showAlert("Требуется обновление Telegram до версии 8.0+");
            return;
        }

        // Визуальный выбор
        cards.forEach(item => item.classList.remove("selected"));
        card.classList.add("selected");

        // Проверка, есть ли вообще ID (если вы забыли заменить заглушку)
        if (!statusId || statusId.startsWith("REPLACE") || statusId === "") {
             tg.showAlert("Ошибка конфигурации: Не указан ID статуса.");
             return;
        }

        tg.requestEmojiStatusAccess(granted => {
            if (!granted) {
                tg.showAlert("Доступ не предоставлен.");
                // Возвращаем визуал назад, если отказали
                card.classList.remove("selected");
                return;
            }

            tg.setEmojiStatus(statusId, { duration: 86400 }, success => {
                if (success) {
                    tg.showPopup({
                        title: "Готово!",
                        message: "Статус успешно установлен.",
                        buttons: [{type: "ok"}]
                    });
                } else {
                    tg.showAlert("Не удалось установить статус. Попробуйте позже.");
                    card.classList.remove("selected");
                }
            });
        });
    });
});
</script>
</body>
</html>
