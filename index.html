<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tuber | Status Selector</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-purple: #9d4edd;
            --dark-bg-start: #1a0b2e;
            --dark-bg-end: #0f0518;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, var(--dark-bg-start) 0%, var(--dark-bg-end) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Фиолетовая атмосфера поверх всего */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 30%, rgba(157, 78, 221, 0.15) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .background-character {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-25%, -50%);
            width: 60vw;
            height: 90vh;
        }

        .container {
            width: 100%;
            max-width: 380px;
            z-index: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff 0%, #d8b4fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .statuses-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .status-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            overflow: hidden;
        }

        /* Эффект свечения при ховере/активе */
        .status-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(157, 78, 221, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .status-card:active {
            transform: scale(0.98);
        }

        .status-card.selected {
            background: rgba(157, 78, 221, 0.15);
            border-color: var(--primary-purple);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
        }

        .icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }

        .desc {
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.2;
        }

        .check-mark {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .status-card.selected .check-mark {
            background: var(--primary-purple);
            border-color: var(--primary-purple);
        }

        .check-mark svg {
            width: 12px;
            height: 12px;
            stroke: #fff;
            stroke-width: 3;
            fill: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
        }

        .status-card.selected .check-mark svg {
            opacity: 1;
            transform: scale(1);
        }

        @media (max-width: 360px) {
            .container {
                max-width: 100%;
            }
            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- Фоновое изображение Lelouch -->
    <img src="https://images6.alphacoders.com/634/634490.png" alt="" class="background-character">

    <div class="container">
        <div class="header">
            <h1>Vibe Check</h1>
            <p>Выбери свой текущий статус</p>
        </div>

        <div class="statuses-list">
            
            <!-- Вариант 1: Очарование / Charm -->
            <div class="status-card" data-key="charm">
                <div class="icon-wrapper">
                    <img src="https://i.gifer.com/embedded/download/PsE.gif" alt="Charm" class="icon-img">
                </div>
                <div class="info-block">
                    <div class="title">с.с.</div>
                    <div class="desc">сиська</div>
                </div>
                <div class="check-mark">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
            </div>

            <!-- Вариант 2: Стратегия / Strategy -->
            <div class="status-card" data-key="strategy">
                <div class="icon-wrapper">
                    <img src="https://media1.tenor.com/m/osKwWYJZjk8AAAAd/lelouch.gif" alt="Strategy" class="icon-img">
                </div>
                <div class="info-block">
                    <div class="title">лелуш пубертатский</div>
                    <div class="desc">шах и мат за 3 хуя в жопе</div>
                </div>
                <div class="check-mark">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
            </div>

            <!-- Вариант 3: Харизма / Charisma -->
            <div class="status-card" data-key="charisma">
                <div class="icon-wrapper">
                    <img src="https://avatars.akamai.steamstatic.com/2ac4b72587acde2e444f8ad9a89622db13000956_full.jpg" alt="Charisma" class="icon-img">
                </div>
                <div class="info-block">
                    <div class="title">похуизм</div>
                    <div class="desc">я еблан</div>
                </div>
                <div class="check-mark">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
            </div>

        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    
    // Инициализация WebApp
    tg.ready();
    tg.expand();

    // ВАЖНО: Здесь должны быть РЕАЛЬНЫЕ ID эмодзи-статусов.
    // Внешние ссылки (gifer, tenor) НЕ РАБОТАЮТ в setEmojiStatus.
    // Вы должны либо:
    // 1. Использовать ID стандартных эмодзи Telegram (например, 🔥, 💎, 🌙).
    // 2. Создать своих кастомных эмодзи через бота и получить их custom_emoji_id.
    // 
    // Для примера ниже я использует placeholder ID. Замените их на рабочие!
    const STATUS_CONFIG = {
        charm: "5287670934029761167",      // Пример ID (замените!)
        strategy: "5303406233913420508",   // Пример ID (замените!)
        charisma: "5287547947641241756"    // Пример ID (замените!)
    };

    const cards = document.querySelectorAll('.status-card');

    cards.forEach(card => {
        card.addEventListener('click', async () => {
            const key = card.dataset.key;
            const emojiId = STATUS_CONFIG[key];

            // Проверка версии приложения
            if (!tg.isVersionAtLeast("8.0")) {
                tg.showAlert("Пожалуйста, обновите Telegram до последней версии.");
                return;
            }

            // Если ID не настроен
            if (!emojiId || emojiId.includes("REPLACE")) {
                 tg.showPopup({
                     title: "Ошибка настройки",
                     message: "ID статуса не указан в коде.",
                     buttons: [{type: "ok"}]
                 });
                 return;
            }

            // Визуальная подсветка выбранной карточки
            cards.forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');

            try {
                // Запрос доступа к установке статуса
                await new Promise((resolve) => {
                    tg.requestEmojiStatusAccess(resolve);
                }).then(granted => {
                    if (!granted) {
                        throw new Error("Доступ запрещен пользователем");
                    }
                    
                    // Установка статуса
                    tg.setEmojiStatus(emojiId, { duration: 86400 }, (success) => {
                        if (success) {
                            tg.showPopup({
                                title: "Успех",
                                message: "Статус успешно установлен!",
                                buttons: [{ type: "close" }]
                            });
                        } else {
                            throw new Error("Не удалось установить статус");
                        }
                    });
                });

            } catch (error) {
                console.error(error);
                card.classList.remove('selected'); // Убираем выделение при ошибке
                tg.showAlert(`Ошибка: ${error.message}`);
            }
        });
    });
</script>
</body>
</html>
